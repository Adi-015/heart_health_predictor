services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    # models/ and data/ are baked into the image at build time,
    # but mount them as volumes for faster iteration without rebuilding
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      # Points frontend at the backend container
      - VITE_API_BASE_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
